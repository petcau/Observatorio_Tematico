<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Observatório de CT&amp;I da Bahia — Eixo Energia</title>

    <!-- Tailwind via CDN (Play CDN): compila as classes utilitárias no navegador, sem etapa de build. -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      body {
        background-color: #f4f6fb;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Bibliotecas via CDN: nenhum npm install, nenhum bundler. -->
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.8/babel.min.js"></script>
    <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

    <!-- Config e lib: JavaScript puro, sem JSX. -->
    <script src="js/config.js"></script>
    <script src="js/lib/csv.js"></script>
    <script src="js/lib/cores.js"></script>
    <script src="js/lib/taxonomia.js"></script>
    <script src="js/lib/tipos.js"></script>
    <script src="js/lib/producoes.js"></script>
    <script src="js/lib/contagens.js"></script>

    <!-- Componentes e App: JSX, transformado no navegador pelo Babel standalone. -->
    <script type="text/babel" data-presets="react" src="js/components/EstadoVazio.js"></script>
    <script type="text/babel" data-presets="react" src="js/components/Header.js"></script>
    <script type="text/babel" data-presets="react" src="js/components/Footer.js"></script>
    <script type="text/babel" data-presets="react" src="js/components/BarraLista.js"></script>
    <script type="text/babel" data-presets="react" src="js/components/GraficoTemas.js"></script>
    <script type="text/babel" data-presets="react" src="js/components/GraficoSubtemas.js"></script>
    <script type="text/babel" data-presets="react" src="js/App.js"></script>
  </body>
</html>
